<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Reset Password — Northstar Cloud</title>
  <link rel="stylesheet" href="../tokens.css" />
  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      min-height: 100vh;
      background: var(--color-bg);
      color: var(--color-fg);
      font-family: var(--font-sans);
      font-size: var(--body-size);
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
      display: grid;
      place-items: center;
      padding: 32px;
    }

    .wrap {
      width: 100%;
      max-width: 440px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .brand-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      font-weight: 600;
    }
    .mark {
      width: 28px;
      height: 28px;
      border-radius: var(--radius-sm);
      background: var(--color-accent);
      color: var(--color-accent-fg);
      display: grid;
      place-items: center;
      font-weight: 700;
      font-size: 13px;
    }
    .back-link {
      font-size: 13px;
      color: var(--color-fg-muted);
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      cursor: pointer;
    }
    .back-link:hover { color: var(--color-fg); }

    .card {
      background: var(--color-surface);
      border: 1px solid var(--color-border);
      border-radius: var(--radius-lg);
      padding: 28px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }
    .icon-box {
      width: 40px;
      height: 40px;
      border-radius: var(--radius-md);
      background: var(--color-surface-elevated);
      border: 1px solid var(--color-border);
      display: grid;
      place-items: center;
      color: var(--color-accent);
    }
    h1 {
      margin: 0 0 6px 0;
      font-size: 22px;
      font-weight: 600;
      letter-spacing: -0.02em;
    }
    .desc { margin: 0; font-size: 14px; color: var(--color-fg-muted); }

    form { display: flex; flex-direction: column; gap: 16px; }
    .field { display: flex; flex-direction: column; gap: 6px; }
    label { font-size: 13px; font-weight: 500; }
    input[type="email"] {
      height: 42px;
      padding: 0 12px;
      border-radius: var(--radius-sm);
      border: 1px solid var(--color-border);
      background: var(--color-bg);
      color: var(--color-fg);
      font-family: inherit;
      font-size: 14px;
      outline: none;
    }
    input[type="email"]:focus { border-color: var(--color-accent); }

    .btn {
      height: 42px;
      padding: 0 16px;
      border-radius: var(--radius-sm);
      border: 1px solid var(--color-border);
      background: var(--color-surface-elevated);
      color: var(--color-fg);
      font-family: inherit;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      width: 100%;
    }
    .btn-primary {
      background: var(--color-accent);
      border-color: var(--color-accent);
      color: var(--color-accent-fg);
      font-weight: 600;
    }
    .btn-primary:hover { filter: brightness(1.08); }

    .sent-banner {
      display: none;
      flex-direction: column;
      gap: 14px;
      padding: 16px;
      border-radius: var(--radius-md);
      background: var(--color-bg);
      border: 1px solid rgba(34, 197, 94, 0.35);
    }
    .sent-banner.show { display: flex; }
    .sent-title {
      display: flex;
      align-items: center;
      gap: 8px;
      color: var(--color-success);
      font-weight: 600;
      font-size: 13.5px;
    }
    .sent-meta { font-size: 13px; color: var(--color-fg-muted); margin: 0; }
    .mono { font-family: var(--font-mono); color: var(--color-fg); font-size: 12px; }

    .meta-foot {
      display: flex;
      justify-content: space-between;
      font-size: 12.5px;
      color: var(--color-fg-muted);
      padding: 0 4px;
    }
    .link { color: var(--color-accent); text-decoration: none; font-weight: 500; cursor: pointer; }
    .link:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="brand-row">
      <div class="brand">
        <span class="mark">N</span>
        <span>Northstar Cloud</span>
      </div>
      <a href="#" class="back-link" data-goto="auth-login">← Back to Sign In</a>
    </div>

    <section class="card">
      <div class="icon-box">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M21 2l-2 2m-7.61 7.61a5.5 5.5 0 1 1-7.778 7.778 5.5 5.5 0 0 1 7.777-7.777zm0 0L15.5 7.5m0 0l3 3L22 7l-3-3m-3.5 3.5L19 4"/></svg>
      </div>

      <div>
        <h1>Reset your password</h1>
        <p class="desc">Enter your workspace email and we'll send a single-use recovery link valid for 15 minutes.</p>
      </div>

      <form id="reset-form">
        <div class="field">
          <label for="email">Work email</label>
          <input id="email" type="email" value="alex@northstar.dev" required />
        </div>
        <button type="submit" class="btn btn-primary">Send Reset Link</button>
      </form>

      <div id="sent-banner" class="sent-banner">
        <div class="sent-title">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M20 6L9 17l-5-5"/></svg>
          Recovery link dispatched
        </div>
        <p class="sent-meta">Sent to <span id="sent-email" class="mono">alex@northstar.dev</span>. Check your inbox or return to sign in once updated.</p>
        <button type="button" class="btn btn-primary" data-goto="auth-login">Return to Sign In →</button>
      </div>
    </section>

    <div class="meta-foot">
      <span>Need a new workspace?</span>
      <a href="#" class="link" data-goto="auth-signup">Create account</a>
    </div>
  </div>

  <script>
    document.getElementById('reset-form').addEventListener('submit', (e) => {
      e.preventDefault();
      const email = document.getElementById('email').value.trim();
      document.getElementById('sent-email').textContent = email || 'alex@northstar.dev';
      document.getElementById('sent-banner').classList.add('show');
    });
  </script>
</body>
</html>
